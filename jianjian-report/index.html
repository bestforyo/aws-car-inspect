<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>车辆检测报告 · 鉴见</title>

<style>
:root{
  --forest:#174D45; --forest-deep:#123B35; --forest-soft:#2C6B5E; --lime:#C7E86A;
  --ink:#1C2B2A; --muted:#6B7A78; --faint:#94A09E; --line:#D5DED9; --line-soft:#EAF0EC; --bg:#EDF1EE;
  --card:#FFFFFF; --good:#2E7D5B; --good-bg:#EAF5EF; --warn:#B07A12; --warn-bg:#FBF2DF;
  --bad:#B8402F; --bad-bg:#FBECE8; --info:#2C6E9B; --info-bg:#E8F1F8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
.phone{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
.bar{height:44px;background:var(--forest-deep);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px}
.bar .brand{font-weight:600;letter-spacing:1px}
.bar .brand small{font-size:8px;letter-spacing:1.2px;opacity:.6;margin-left:6px;font-weight:400}
.bar .tag{font-size:10px;border:1px solid rgba(199,232,106,.5);color:var(--lime);padding:2px 8px;border-radius:10px}

.hero{background:linear-gradient(160deg,var(--forest-deep),var(--forest));color:#fff;padding:20px 18px 40px;position:relative}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:220px;height:220px;border:1px solid rgba(199,232,106,.12);border-radius:50%}
.hero::before{content:"";position:absolute;right:20px;top:20px;width:130px;height:130px;border:1px solid rgba(199,232,106,.09);border-radius:50%}
.hero-veh{display:flex;gap:14px;align-items:center;position:relative;z-index:2}
.hero-info{flex:1;min-width:0}
.hero-name{font-size:18px;font-weight:600;line-height:1.3}
.hero-vin{font-family:ui-monospace,monospace;font-size:11px;color:rgba(255,255,255,.62);letter-spacing:.5px;margin-top:5px}
.hero-concl{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:10px;color:rgba(255,255,255,.65)}
.hero-concl b{font-size:11px;color:var(--forest-deep);background:var(--lime);border-radius:4px;padding:2px 8px;font-weight:600}
.hero-concl b.attention{color:#fff;background:var(--bad)}
.hero-sub{font-size:9px;color:rgba(255,255,255,.45);margin-top:6px}
.hero-photo{width:118px;height:82px;border-radius:8px;overflow:hidden;flex-shrink:0;border:1px solid rgba(199,232,106,.35);position:relative}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block}
.hp-tag{position:absolute;left:4px;bottom:4px;background:rgba(18,59,53,.78);color:var(--lime);font-size:8px;padding:1px 5px;border-radius:3px}

.wrap{padding:0;margin-top:-28px;position:relative;z-index:2}
.card{background:var(--card);border:1px solid var(--line);border-radius:0;margin-bottom:10px;overflow:hidden}

.verdicts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft)}
.verdict{background:var(--card);padding:14px 6px;text-align:center}
.verdict .ic{width:34px;height:34px;border-radius:50%;background:var(--good-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 7px}
.verdict .ic.bad{background:var(--bad-bg)}
.verdict .ic svg{width:19px;height:19px;stroke:var(--good);fill:none;stroke-width:1.7}
.verdict .ic.bad svg{stroke:var(--bad)}
.verdict .lb{font-size:12px;font-weight:600;color:var(--good)}
.verdict .lb.bad{color:var(--bad)}
.verdict .sub{font-size:9px;color:var(--faint);margin-top:2px}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft)}
.metric{background:var(--card);padding:16px 4px 14px;text-align:center}
.ring{width:52px;height:52px;margin:0 auto 7px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.ring::after{content:"";position:absolute;width:40px;height:40px;border-radius:50%;background:#fff}
.ring span{position:relative;z-index:2;font-size:13px;font-weight:600}
.metric .ml{font-size:11px;color:var(--muted);margin-top:2px}

.sec-head{padding:13px 16px 11px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between}
.sec-head .t{font-size:15px;font-weight:600}
.sec-head .t .en{font-size:9px;letter-spacing:1.5px;color:var(--faint);font-weight:400;margin-left:7px}
.chk{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.chk .sw{width:30px;height:17px;border-radius:10px;background:#D6DED9;position:relative;transition:.2s}
.chk .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.2s}
.chk.on .sw{background:var(--forest)}
.chk.on .sw::after{left:15px}

.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line-soft);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;font-size:12px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0;cursor:pointer}
.tab.on{color:var(--forest);font-weight:600;border-color:var(--forest)}
.tab .num{font-size:9px;color:var(--faint);margin-left:3px}

.concl{margin:14px;padding:14px;background:#F7FAF8;border-radius:9px}
.concl .ch{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.concl .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.concl .body{font-size:12px;color:#465653;line-height:1.85}
.concl .body b{color:var(--forest)}
.concl .more{font-size:10px;color:var(--info);margin-top:8px;display:inline-block}

.illus{margin:0 14px 14px;height:184px;background:#0C211F;border-radius:9px;position:relative;overflow:hidden}
.illus img{width:100%;height:100%;object-fit:cover;display:block}
.illus .cap{position:absolute;bottom:7px;right:10px;font-size:9px;color:rgba(199,232,106,.7);background:rgba(12,33,31,.6);padding:2px 6px;border-radius:3px}

.legends{display:flex;gap:14px;padding:0 16px 11px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.lg i{width:9px;height:9px;border-radius:50%;display:block}
.lg.a i{background:var(--bad)} .lg.b i{background:var(--warn)} .lg.c i{background:var(--good)} .lg.d i{background:#C8D0CC}

.grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-soft);border-bottom:0}
.item{background:var(--card);min-width:0;border-bottom:1px solid var(--line-soft)}
.cell{display:flex;align-items:center;gap:7px;padding:10px 11px;cursor:pointer;min-height:46px}
.cell:active{background:#F7FAF8}
.cell .pico{width:16px;height:16px;flex-shrink:0;opacity:.55}
.cell .info{flex:1;min-width:0}
.cell .nm{font-size:11px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .dsc{font-size:9px;color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0}
.cell .st{font-size:9px;padding:2px 6px;border-radius:9px;white-space:nowrap;flex-shrink:0;font-weight:500;display:flex;align-items:center;gap:3px}
.cell .st::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.st.a{background:var(--bad-bg);color:var(--bad)} .st.b{background:var(--warn-bg);color:var(--warn)} .st.c{background:var(--good-bg);color:var(--good)} .st.d{background:#EEF1EF;color:#8A9591}

.detail{background:#F7FAF8;padding:11px 11px;font-size:11px;display:none}
.detail.open{display:block}
.detail .row{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted)}
.detail .row b{color:var(--ink);font-weight:500}
.detail .ph{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.detail .ph .bigph{width:132px;height:88px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#EEF2EF;cursor:zoom-in}
.detail .ph .bigph img{width:100%;height:100%;object-fit:cover;display:block}
.detail .ph .bigph svg{width:100%;height:100%;display:block}
.detail .ph .phcap{font-size:10px;color:var(--faint);line-height:1.7;max-width:150px}
.detail .ph .phlock{font-size:10px;color:var(--faint);line-height:1.7;max-width:160px;background:#EEF1EF;padding:8px;border-radius:6px}

.integrity{padding:16px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.kv:last-child{border:none}
.kv .k{color:var(--muted)}
.kv .v{font-family:ui-monospace,monospace;font-size:11px;text-align:right;word-break:break-all;max-width:62%}
.timeline{margin-top:14px;padding-left:16px;border-left:1px solid var(--line-soft)}
.tl{position:relative;padding:0 0 13px 14px;font-size:11px;color:var(--muted)}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:-20px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--forest);border:2px solid #fff}
.tl b{color:var(--ink);font-weight:500;display:block}
.tl span{font-size:10px;color:var(--faint)}

.disclaimer{padding:16px;background:#F7FAF8;font-size:11px;color:var(--muted);line-height:1.8}
.disclaimer .h{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px}
.sign{text-align:center;padding:18px 0 28px;font-size:10px;color:var(--faint);line-height:1.9}
.sign .seal{display:inline-block;border:1px solid var(--forest);color:var(--forest);border-radius:4px;padding:4px 12px;letter-spacing:3px;font-size:11px;margin-bottom:8px}

.photo-viewer{position:fixed;inset:0;background:rgba(12,27,25,.9);z-index:99;display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.photo-viewer .pv-inner{width:100%;max-width:440px}
.photo-viewer .pv-title{color:#fff;font-size:13px;margin-bottom:12px;text-align:center}
.photo-viewer img,.photo-viewer svg{width:100%;border-radius:8px;display:block;background:#EEF2EF}
.photo-viewer .pv-meta{color:var(--lime);font-size:12px;margin-top:12px;text-align:center}
.photo-viewer .pv-close{color:rgba(255,255,255,.5);font-size:11px;margin-top:22px;text-align:center}

.state{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;background:var(--bg)}
.state-box{max-width:340px}
.state-icon{width:58px;height:58px;border-radius:50%;background:var(--bad-bg);color:var(--bad);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px}
.state h3{font-size:17px;margin-bottom:8px}
.state p{color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.7}
.spinner{width:26px;height:26px;border:3px solid #CFE7D9;border-top-color:var(--forest);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

        ['刹车系统故障码','c','无故障码','—',''],['娱乐系统故障码','c','无故障码','—',''],['其他','c','无故障码','—','']
      ] }
  ];
  var DEMO_VIEW = {
    meta:{ vehicleName:'大众 帕萨特 330TSI', vehicleId:'LFZ7********028367', conclusion:'车况良好',
      conclusionAttention:false, sub:'无重大事故 · 无泡水 · 无火烧', photoTag:'现场实拍',
      reportNo:'JJC-20261124-0086', org:'鉴见示范检测中心', inspector:'陈工 · 持证检测师',
      pack:'团标整车检测（示范清单）', standard:'机构审核发布的适用模板', version:'v1.0 · 发布时锁定',
      hash:'9f3a7c21e8b4d506…c21e' },
    alerts:[],
    timeline:[
      {t:'报告发布',s:'2026-11-24 15:42 · 机构管理员签发'},
      {t:'审核通过',s:'2026-11-24 15:38 · 报告版本冻结'},
      {t:'现场检测提交',s:'2026-11-24 14:20 · 检测师陈工'},
      {t:'订单创建',s:'2026-11-24 13:05 · 团标整车检测'}
    ],
    disclaimer:'本报告基于现场检测时点车辆状况出具。检测项目为示范清单，标准依据与专业结论须经机构审核确认；报告仅对本次受检车辆负责，不含估价、交易撮合或价值承诺。完整标准原文不作为公开附件。结构示意图仅用于标注部位，非现场影像；现场照片以检测师实际上传为准。',
    modules:DEMO_MODULES
  };

  // 把云端公开查询返回的字段适配为新设计所需结构
  function adaptReport(d) {
    var alerts = d.alerts || [];
    var hasIssue = alerts.some(function (a) {
      var t = String(a.type || '') + String(a.title || '');
      return /accident|water|fire|事故|泡水|火烧/.test(t);
    });
    var sections = d.sections || [];
    var modules = sections.map(function (s, i) {
      var items = (s.items || []).map(function (it) {
        return [it.n || '—', colorState(it.color), it.result || '—', it.note || '—', it.threshold || ''];
      });
      var flaw = items.filter(function (x) { return x[1] === 'a' || x[1] === 'b'; }).length;
      var uncheck = items.filter(function (x) { return x[1] === 'd'; }).length;
      var name = esc(s.name || '检测模块 ' + (i + 1));
      var text = '经<b>鉴见检测</b>，' + name + '共 <b>' + items.length + ' 项</b>，其中 ' + flaw +
        ' 项存在瑕疵或异常' + (uncheck ? '，' + uncheck + ' 项不可检' : '') + '。明细如下。';
      var ph = (d.photos || []).filter(function (g) { return g && g.n === s.name; });
      return { key:'m' + i, name:name, conclTitle:name + '结论', text:text,
        total:items.length, flaw:flaw, items:items, photos:ph };
    });
    var sub = alerts.length ? alerts.map(function (a) { return esc(a.title || a.text || '详见结论'); }).join(' · ') : '未触发事故 / 泡水 / 火烧提示';
    var timeline = [];
    if (d.published_at) timeline.push({ t:'报告发布', s:fmtTime(d.published_at) + ' · 机构管理员签发' });
    timeline.push({ t:'审核通过', s:'审核发布时已冻结报告版本' });
    return {
      meta:{
        vehicleName: d.vehicle_kind === 'MOTORCYCLE' ? '受检摩托车' : '受检乘用车',
        vehicleId: '车辆标识 ' + (d.plate ? maskPlate(d.plate) : '已脱敏'),
        conclusion: hasIssue ? '需重点关注' : '车况良好', conclusionAttention:hasIssue,
        sub:sub, photoTag:'车辆示意',
        reportNo: d.report_no || '—', org: d.org_name || '—', inspector:'以机构签发为准',
        pack: d.package_name || '—', standard: d.standard || '机构审核发布的适用模板',
        version:'发布时锁定', hash:'—'
      },
      alerts:alerts, timeline:timeline,
      disclaimer:(d.disclaimer || '') + (d.include_photos === false ? ' 本次分享未包含现场影像。' : ''),
      modules:modules
    };
  }

  function verdictHtml(alerts) {
    var defs = [
      {k:'accident', ico:ICONS.shield, ok:'非事故车', bad:'事故车提示', okSub:'结构件无重大损伤', badSub:'发现疑似事故痕迹'},
      {k:'water', ico:ICONS.wave, ok:'非泡水车', bad:'泡水车提示', okSub:'无水渍泥沙痕迹', badSub:'发现疑似泡水痕迹'},
      {k:'fire', ico:ICONS.fire, ok:'非火烧车', bad:'火烧车提示', okSub:'无熏黑碳化痕迹', badSub:'发现疑似火烧痕迹'}
    ];
    return defs.map(function (v) {
      var hit = (alerts || []).some(function (a) {
        return new RegExp(v.k + '|' + ({accident:'事故',water:'泡水',fire:'火烧'}[v.k])).test(String(a.type || '') + String(a.title || ''));
      });
      return '<div class="verdict"><div class="ic' + (hit ? ' bad' : '') + '">' + v.ico + '</div>' +
        '<div class="lb' + (hit ? ' bad' : '') + '">' + (hit ? v.bad : v.ok) + '</div>' +
        '<div class="sub">' + (hit ? v.badSub : v.okSub) + '</div></div>';
    }).join('');
  }

  function photoSvg(seed, state) {
    var tint = {a:['#C0553F','#F1DDD5'],b:['#B07A12','#F5EBCF'],c:['#2E7D5B','#D9EDE2'],d:['#86948F','#E3E8E5']}[state] || ['#86948F','#E3E8E5'];
    var c = tint[0], bg = tint[1], v = (seed * 37) % 30;
    return '<svg viewBox="0 0 132 88" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
      '<rect width="132" height="88" fill="' + bg + '"/>' +
      '<path d="M0 66 Q40 60 72 66 T132 64 L132 88 L0 88 Z" fill="' + c + '" opacity=".14"/>' +
      '<g stroke="' + c + '" stroke-width="1.1" fill="none" opacity=".85">' +
        '<path d="M14 58 L24 40 L54 35 L68 22 L104 22 L120 40 L128 46"/>' +
        '<path d="M14 58 L128 48 M24 40 L54 35 M68 22 L66 57 M104 22 L106 56"/>' +
        '<circle cx="36" cy="60" r="9"/><circle cx="106" cy="60" r="9"/></g>' +
      '<rect x="' + (30 + v) + '" y="' + (30 + v % 12) + '" width="22" height="16" rx="2" fill="' + c + '" opacity=".5"/>' +
      '<path d="M' + (30 + v) + ' ' + (30 + v % 12) + ' l22 16 m0 -16 l-22 16" stroke="#fff" stroke-width="1" opacity=".7"/></svg>';
  }
  var stText = {a:'中度瑕疵', b:'轻微瑕疵', c:'正常', d:'不可检'};
  var imgIcon = '<svg class="pico" viewBox="0 0 24 24" fill="none" stroke="#5A6E68" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9" r="1.6"/><path d="M3.5 17l5-5 3.5 3.5 3-3 5.5 5.5"/></svg>';

  function renderMetrics() {
    document.getElementById('metrics').innerHTML = MODULES.map(function (m) {
      var pct = m.total ? Math.round(m.flaw / m.total * 100) : 0;
      var col = m.flaw === 0 ? 'var(--good)' : 'var(--warn)';
      return '<div class="metric"><div class="ring" style="background:conic-gradient(' + col + ' 0 ' + pct + '%, #EBF0EC ' + pct + '% 100%)"><span>' + m.flaw + '/' + m.total + '</span></div>' +
        '<div class="ml">' + m.name + '</div></div>';
    }).join('');
  }
  function buildTabs() {
    var tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    MODULES.forEach(function (m, i) {
      var t = document.createElement('div');
      t.className = 'tab' + (i === 0 ? ' on' : '');
      t.innerHTML = m.name + '<span class="num">' + m.flaw + '</span>';
      t.onclick = function () {
        current = i;
        [].forEach.call(tabsEl.children, function (x, j) { x.className = 'tab' + (j === i ? ' on' : ''); });
        flawOnly = false; document.getElementById('onlyFlaw').classList.remove('on');
        render();
      };
      tabsEl.appendChild(t);
    });
  }
  function render() {
    var m = MODULES[current];
    if (!m) return;
    var list = flawOnly ? m.items.filter(function (x) { return x[1] === 'a' || x[1] === 'b' || x[1] === 'd'; }) : m.items;
    var groups = m.photos || [];
    var cells = list.map(function (it, i) {
      var base = photoSvg(i + current * 11, it[1]);
      var imgHtml = '', cap = '现场检测照片（示意）<br/>点击查看大图 · 实拍以检测师上传为准';
      if (groups.length && groups[0].urls && groups[0].urls.length) {
        var u = groups[0].urls[0];
        if (/^https?:/.test(u)) {
          imgHtml = '<img src="' + esc(u) + '" alt="现场照片" />';
          cap = '现场检测照片 · 点击查看大图';
        } else {
          imgHtml = base;
          cap = '现场影像存于云端，需机构授权后查看';
        }
      } else { imgHtml = base; }
      return '<div class="item"><div class="cell" onclick="window.__jjDetail(' + i + ')">' +
        '<div class="info"><div class="nm">' + esc(it[0]) + '</div>' +
        '<div class="dsc">' + (it[4] ? '尺寸 ' + esc(it[4]) : (it[3] && it[3] !== '—' ? esc(it[3]) : stText[it[1]])) + '</div></div>' +
        '<span class="right-wrap">' + imgIcon + '<span class="st ' + it[1] + '">' + stText[it[1]] + '</span></span></div>' +
        '<div class="detail" id="d' + i + '">' +
        '<div class="row"><span>车况状态</span><b>' + esc(it[2]) + '</b></div>' +
        '<div class="row"><span>尺寸判定</span><b>' + (it[4] ? esc(it[4]) : '不适用') + '</b></div>' +
        '<div class="row"><span>说明</span><b>' + esc(it[3]) + '</b></div>' +
        '<div class="ph"><div class="bigph" onclick="window.__jjZoom(' + i + ')">' + imgHtml + '</div>' +
        '<div class="phcap">' + cap + '</div></div></div></div>';
    }).join('');
    document.getElementById('moduleBody').innerHTML =
      '<div class="concl"><div class="ch"><span class="dot"></span><span class="ct">' + m.conclTitle + '</span></div>' +
        '<div class="body">' + m.text + '</div></div>' +
      '<div class="illus"><img src="' + HERO_IMG + '" alt="全息车辆结构示意"/><span class="cap">全息结构示意 · 非现场影像</span></div>' +
      '<div class="legends"><span class="lg a"><i></i>中度瑕疵</span><span class="lg b"><i></i>轻微瑕疵</span>' +
        '<span class="lg c"><i></i>正常</span><span class="lg d"><i></i>不可检</span></div>' +
      '<div class="grid">' + cells + '</div>';
  }
  window.__jjDetail = function (i) {
    var el = document.getElementById('d' + i);
    if (el) el.classList.toggle('open');
  };
  window.__jjZoom = function (i) {
    var m = MODULES[current];
    var list = flawOnly ? m.items.filter(function (x) { return x[1] === 'a' || x[1] === 'b' || x[1] === 'd'; }) : m.items;
    var it = list[i];
    var groups = m.photos || [];
    var html, isImg = false;
    if (groups.length && groups[0].urls && groups[0].urls.length && /^https?:/.test(groups[0].urls[0])) {
      html = '<img src="' + esc(groups[0].urls[0]) + '" alt="现场照片"/>'; isImg = true;
    } else { html = photoSvg(i + current * 11, it[1]); }
    var ov = document.createElement('div');
    ov.className = 'photo-viewer';
    ov.innerHTML = '<div class="pv-inner"><div class="pv-title">现场照片' + (isImg ? '' : '（示意）') + ' · ' + esc(it[0]) + '</div>' + html +
      '<div class="pv-meta">车况状态：' + esc(it[2]) + '</div><div class="pv-close">点击关闭</div></div>';
    ov.onclick = function () { document.body.removeChild(ov); };
    document.body.appendChild(ov);
  };

  function renderView(view) {
    var v = view, meta = v.meta;
    MODULES = v.modules;
    current = 0; flawOnly = false;
    var kv = function (k, val, mono) {
      return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v"' + (mono ? '' : ' style="font-family:inherit"') + '>' + esc(val || '—') + '</span></div>';
    };
    var tl = (v.timeline || []).map(function (x) {
      return '<div class="tl"><b>' + esc(x.t) + '</b><span>' + esc(x.s) + '</span></div>';
    }).join('');
    app.innerHTML =
      '<div class="bar"><div class="brand">鉴见<small>INSPECTION STUDIO</small></div><div class="tag">只读报告 · 鉴见检测</div></div>' +
      '<div class="hero"><div class="hero-veh"><div class="hero-info">' +
        '<div class="hero-name">' + esc(meta.vehicleName) + '</div>' +
        '<div class="hero-vin">' + esc(meta.vehicleId) + '</div>' +
        '<div class="hero-concl"><span>检测结论</span><b' + (meta.conclusionAttention ? ' class="attention"' : '') + '>' + esc(meta.conclusion) + '</b></div>' +
        '<div class="hero-sub">' + esc(meta.sub) + '</div></div>' +
        '<div class="hero-photo"><img src="' + HERO_IMG + '" alt="受检车辆"/><span class="hp-tag">' + esc(meta.photoTag) + '</span></div>' +
      '</div></div>' +
      '<div class="wrap">' +
        '<div class="card"><div class="verdicts">' + verdictHtml(v.alerts) + '</div></div>' +
        '<div class="card"><div class="sec-head"><div class="t">检测概况 <span class="en">OVERVIEW</span></div>' +
          '<div style="font-size:9px;color:var(--faint)">瑕疵 / 已检</div></div><div class="metrics" id="metrics"></div></div>' +
        '<div class="card"><div class="sec-head"><div class="t">重大问题检测 <span class="en">KEY FINDINGS</span></div>' +
          '<div class="chk" id="onlyFlaw"><span>只看瑕疵</span><div class="sw"></div></div></div>' +
          '<div class="tabs" id="tabs"></div><div id="moduleBody"></div></div>' +
        '<div class="card"><div class="sec-head"><div class="t">报告信息 <span class="en">INTEGRITY</span></div></div><div class="integrity">' +
          kv('签发机构', meta.org) + kv('检测师', meta.inspector) + kv('检测套餐', meta.pack) +
          kv('标准依据', meta.standard) + kv('报告版本', meta.version) + kv('内容哈希', meta.hash, true) +
          (tl ? '<div class="timeline">' + tl + '</div>' : '') + '</div></div>' +
        '<div class="card"><div class="disclaimer"><div class="h">说明与免责</div>' + esc(v.disclaimer) + '</div></div>' +
        '<div class="sign"><div class="seal">鉴 见 检 测</div><br/>报告编号 ' + esc(meta.reportNo) +
          ' · 签发机构 ' + esc(meta.org) + '<br/>鉴见 · INSPECTION STUDIO</div>' +
      '</div>';
    renderMetrics();
    buildTabs();
    document.getElementById('onlyFlaw').onclick = function () {
      flawOnly = !flawOnly;
      this.classList.toggle('on', flawOnly);
      render();
    };
    render();
  }

  function main() {
    if (/[?&]demo=1/.test(location.search)) { renderView(DEMO_VIEW); return; }
    var token = getToken();
    if (!token) { state('!', '链接无效', '缺少分享令牌，请向检测机构索取完整链接。'); return; }
    state('', '正在加载报告', '校验分享链接有效性…', true);
    db.rpc('public_report_by_token', { p_token: token }).then(function (r) {
      var d = r && r.data;
      if (r && r.error) { state('!', '无法读取报告', '服务暂时不可用，请稍后重试。'); return; }
      if (!d || !d.valid) {
        var reason = d && d.reason;
        var msg = reason === 'invalid_or_expired' ? '链接已过期或被撤销，请联系检测机构重新生成。'
          : reason === 'unavailable' ? '报告暂不可用，请联系检测机构。'
          : '分享令牌无效，请核对后重试。';
        state('!', '链接不可用', msg);
        return;
      }
      renderView(adaptReport(d));
    }).catch(function () {
      state('!', '加载失败', '网络连接异常，请检查网络后重试。');
    });
  }
  main();
})();
</script>
